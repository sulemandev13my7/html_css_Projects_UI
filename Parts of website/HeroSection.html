<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>
    <link rel="stylesheet" href="HeroSection.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <!-- Header section -->
    <header class="header" id="header">
        <nav class="navbar container">
            <a href="#" class="brand">Brand</a>
            <div class="burger" id="burger">
                <span class="burger-line"></span>
                <span class="burger-line"></span>
                <span class="burger-line"></span>
            </div>
            <div class="menu" id="menu">
                <ul class="menu-inner">
                    <li class="menu-item"><a href="#" class="menu-link">Home</a></li>
                    <li class="menu-item"><a href="#" class="menu-link">Feature</a></li>
                    <li class="menu-item"><a href="#" class="menu-link">Product</a></li>
                    <li class="menu-item"><a href="#" class="menu-link">Article</a></li>
                    <li class="menu-item"><a href="#" class="menu-link">Support</a></li>
                </ul>
            </div>
            <span class="overlay"></span>
            <button type="button" class="menu-block">
                <a href="#" class="btn btn-neutral">Register</a>
            </button>
        </nav>
    </header>
    <!-- Main section -->
    <main class="main">
        <section class="section banner-section">
            <div class="container banner-column">
                <img src="https://i.imghippo.com/files/gJf9722OfM.png" class="banner-image" width="480" height="360"
                    fetchpriority="high" alt="banner image">
                <div class="banner-inner">
                    <h1 class="title-large">Experience Media Like Never Before</h1>
                    <p class="text-base font-normal">
                        Enjoy award-winning stereo beats with wireless listening freedom and sleek,
                        streamlined with premium padded and delivering first-rate playback.
                    </p>
                    <button type="button" class="btn btn-primary">
                        Discover Now <i class="bx bx-chevron-right"></i>
                    </button>
                </div>
                <div class="banner-link">
                    <a href="#" title=""><i class="bx bxl-facebook"></i></a>
                    <a href="#" title=""><i class="bx bxl-instagram"></i></a>
                    <a href="#" title=""><i class="bx bxl-twitter"></i></a>
                    <a href="#" title=""><i class="bx bxl-youtube"></i></a>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
