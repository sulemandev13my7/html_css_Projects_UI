<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="project2.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <div class="wrapper">
            <h1>Login</h1>
            <form action="">
                <!-- username -->
                <div class="text_field">
                    <label for="username">Username</label>
                    <div>
                        <input type="text" id="username" name="username" placeholder="Enter Your Username" required>
                        <i class="input_box_icon ri-user-3-fill"></i>
                    </div>
                </div>
                <!-- password -->
                <div class="text_field">
                    <label for="password">Password</label>
                    <div>
                        <input type="password" id="password" name="password" placeholder="Enter Your Password" required>
                        <i class="input_box_icon ri-lock-line"></i>
                    </div>
                </div>
                <p class="forgot">Forgot Password?</p>
                <button>Login</button>
            </form>
            <p class="signup_text"> Sign up using</p>
            <div class="icons">
                <p><i class="icons ri-facebook-circle-fill"></i></p>
                <p><i class="icons ri-google-fill"></i></p>
                <p><i class="icons ri-twitter-fill"></i></p>
            </div>
        </div>
    </div>
</body>

</html>
